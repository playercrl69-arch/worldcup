<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Plyr CSS -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

<style>
/* Player container */
.player-wrapper {
    position: relative;
    max-width: 100%;
    background: #000;
}

/* Top fullscreen button */
.top-fullscreen {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 99;
    background: rgba(0,0,0,0.7);
    color: #fff;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
}

/* Remove fullscreen from bottom controls */
.plyr__controls button[data-plyr="fullscreen"] {
    display: none !important;
}
</style>
</head>

<body>

<div class="player-wrapper">
    <button class="top-fullscreen" onclick="goFullscreen()">⛶</button>
    <video id="player" playsinline controls></video>
</div>

<!-- HLS.js -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<!-- Plyr JS -->
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<script>
const video = document.getElementById('player');
const source = "https://live-en.aisports.cc/moviebox/device01/playlist.m3u8";

/* HLS support */
if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(source);
    hls.attachMedia(video);
} else {
    video.src = source;
}

/* Plyr init */
const player = new Plyr(video, {
    controls: [
        'play',
        'progress',
        'current-time',
        'mute',
        'volume'
    ]
});

/* Fullscreen + Landscape lock */
function goFullscreen() {
    if (video.requestFullscreen) video.requestFullscreen();
    else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();

    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
    }
}
</script>

</body>
</html>
