<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Player</title>

<!-- Plyr CSS -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

<style>
body {
    margin: 0;
    background: #000;
}

/* Player wrapper */
.player-wrapper {
    position: relative;
    max-width: 100%;
    background: #000;
}

/* Top fullscreen button */
.top-fullscreen {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 99;
    background: rgba(0,0,0,0.7);
    color: #fff;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
}

/* Remove fullscreen from bottom controls */
.plyr__controls button[data-plyr="fullscreen"] {
    display: none !important;
}

/* Premium watermark credit */
.credit-watermark {
    position: absolute;
    bottom: 10px;
    right: 12px;
    z-index: 50;
    font-size: 11px;
    color: #fff;
    opacity: 0.6;
    background: rgba(0,0,0,0.4);
    padding: 4px 8px;
    border-radius: 6px;
    pointer-events: none;
}
</style>
</head>

<body>

<div class="player-wrapper">
    <!-- Top fullscreen button -->
    <button class="top-fullscreen" onclick="goFullscreen()">⛶</button>

    <!-- Video -->
    <video id="player" playsinline controls></video>

    <!-- Credit watermark -->
    <div class="credit-watermark">© Created by Ramit</div>
</div>

<!-- HLS.js -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<!-- Plyr JS -->
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<script>
const video = document.getElementById('player');
const source = "https://live-en.aisports.cc/moviebox/device01/playlist.m3u8";

/* Load HLS */
if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(source);
    hls.attachMedia(video);
} else {
    video.src = source;
}

/* Init Plyr */
const player = new Plyr(video, {
    controls: [
        'play',
        'progress',
        'current-time',
        'mute',
        'volume'
    ]
});

/* Fullscreen + landscape lock */
function goFullscreen() {
    if (video.requestFullscreen) {
        video.requestFullscreen();
    } else if (video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen();
    }

    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
    }
}
</script>

</body>
</html>
