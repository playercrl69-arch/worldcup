<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plyr Player</title>

<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

<style>
body {
    margin: 0;
    background: #000;
}

.player-wrapper {
    position: relative;
}

/* Top fullscreen button */
.top-fullscreen {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 10;
    background: rgba(0,0,0,0.6);
    color: #fff;
    border: none;
    padding: 6px 10px;
    border-radius: 5px;
    font-size: 14px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="player-wrapper">
    <button class="top-fullscreen" onclick="goFullscreen()">⛶</button>
    <video id="player" controls playsinline></video>
</div>

<!-- Watermark BELOW player -->
<div style="text-align:center;font-size:13px;color:#aaa;margin:8px 0;">
    © Created by Ramit
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<script>
const video = document.getElementById('player');
const source = "https://webott.viatv.com.np/v0t1/CineplexHD.stream/chunks.m3u8";

/* HLS */
if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(source);
    hls.attachMedia(video);
} else {
    video.src = source;
}

/* Plyr default */
const player = new Plyr(video);

/* ✅ Correct fullscreen */
function goFullscreen() {
    player.fullscreen.enter();

    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
    }
}
</script>

</body>
</html>
