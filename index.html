<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Player</title>

<!-- Plyr CSS -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
</head>

<body style="margin:0;background:#000;">

<!-- Player -->
<video id="player" controls playsinline></video>

<!-- Watermark BELOW player -->
<div style="
text-align:center;
font-size:13px;
color:#aaa;
margin:8px 0 12px 0;">
© Created by Ramit
</div>

<!-- HLS.js -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<!-- Plyr JS -->
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<script>
const video = document.getElementById('player');
const source = "https://live-en.aisports.cc/moviebox/device01/playlist.m3u8";

/* Load HLS */
if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(source);
    hls.attachMedia(video);
} else {
    video.src = source;
}

/* Plyr default (no customization) */
const player = new Plyr(video);

/* Force landscape on fullscreen (mobile) */
video.addEventListener('enterpictureinpicture', lockLandscape);
video.addEventListener('webkitbeginfullscreen', lockLandscape);
video.addEventListener('fullscreenchange', lockLandscape);

function lockLandscape() {
    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
    }
}
</script>

</body>
</html>
