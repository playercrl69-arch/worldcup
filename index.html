<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plyr Player</title>

<!-- Plyr CSS -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

<style>
body {
    margin: 0;
    background: #000;
}

/* Wrapper only for top button positioning */
.player-wrapper {
    position: relative;
}

/* Top fullscreen button (simple) */
.top-fullscreen {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 10;
    background: rgba(0,0,0,0.6);
    color: #fff;
    border: none;
    padding: 6px 10px;
    border-radius: 5px;
    font-size: 14px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="player-wrapper">
    <!-- Top fullscreen button -->
    <button class="top-fullscreen" onclick="goFullscreen()">⛶</button>

    <!-- Video -->
    <video id="player" controls playsinline></video>
</div>

<!-- Watermark BELOW player -->
<div style="text-align:center;font-size:13px;color:#aaa;margin:8px 0;">
    © Created by Ramit
</div>

<!-- HLS.js -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<!-- Plyr JS -->
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<script>
const video = document.getElementById('player');
const source = "https://live-en.aisports.cc/moviebox/device01/playlist.m3u8";

/* Load HLS */
if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(source);
    hls.attachMedia(video);
} else {
    video.src = source;
}

/* Plyr DEFAULT init */
const player = new Plyr(video);

/* Fullscreen + landscape */
function goFullscreen() {
    if (video.requestFullscreen) {
        video.requestFullscreen();
    } else if (video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen();
    }

    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
    }
}
</script>

</body>
</html>
